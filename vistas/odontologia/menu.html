<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; object-src 'none'">
  <meta charset="utf-8"><script src="bridge.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .menu-btn {
      background: white;
      border: none;
      border-radius: 14px;
      padding: 25px 15px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .menu-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    }

    .menu-btn .icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .menu-btn .title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .menu-btn .desc {
      font-size: 11px;
      color: #888;
    }

    .menu-btn.wide {
      grid-column: 1 / -1;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🦷 Sistema Odontológico</h1>
      <p>Seleccioná qué querés hacer</p>
    </div>

    <div class="menu-grid">
      <a class="menu-btn" href="prestacion.html">
        <div class="icon">📝</div>
        <div class="title">Nueva Prestación</div>
        <div class="desc">Cargar atención de un paciente</div>
      </a>

      <a class="menu-btn" href="odontologo.html">
        <div class="icon">👨‍⚕️</div>
        <div class="title">Agregar Odontólogo</div>
        <div class="desc">Sumar profesional al equipo</div>
      </a>

      <a class="menu-btn" href="pagos.html">
        <div class="icon">💰</div>
        <div class="title">Cargar Pagos</div>
        <div class="desc">Marcar prestaciones pagadas</div>
      </a>

      <a class="menu-btn" href="reporte.html">
        <div class="icon">📊</div>
        <div class="title">Reporte Mensual</div>
        <div class="desc">Ver métricas del período</div>
      </a>
    </div>

    <div class="footer">
      Sistema de Gestión Odontológica v2.0
    </div>
  </div>
</body>
</html>
